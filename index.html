<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silenciar</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --text: #e8e9ec;
    --muted: #9a9fab;
    --accent: #e11d48;
    --accent-hover: #be123c;
    --ring: rgba(225, 29, 72, 0.35);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: radial-gradient(circle at top, #1b1f27, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    padding: 32px 36px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .texto {
    font-size: 1.05rem;
    line-height: 1.5;
    color: var(--text);
    flex: 1;
  }

  .texto span {
    color: var(--muted);
    display: block;
    font-size: 0.8rem;
    margin-top: 6px;
    letter-spacing: 0.02em;
  }

  button.silenciar {
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 14px var(--ring);
  }

  button.silenciar:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  button.silenciar:active {
    transform: translateY(0);
    box-shadow: none;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: black;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  .overlay.activo {
    display: flex;
  }

  .overlay img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .overlay .cerrar {
    position: absolute;
    top: 18px;
    right: 18px;
    background: rgba(255, 255, 255, 0.08);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    backdrop-filter: blur(4px);
  }

  .overlay .cerrar:hover {
    background: rgba(255, 255, 255, 0.18);
  }
</style>
</head>
<body>

  <div class="card">
    <p class="texto">
      Jon Padel Cayetano
    </p>
    <button class="silenciar" id="btnSilenciar">Silenciar</button>
  </div>

  <div class="overlay" id="overlay">
    <button class="cerrar" id="btnCerrar">Cerrar ✕</button>
    <img id="imgFullscreen" src="./edorta.png">
  </div>

  <script>
    const btn = document.getElementById('btnSilenciar');
    const overlay = document.getElementById('overlay');
    const btnCerrar = document.getElementById('btnCerrar');

    btn.addEventListener('click', () => {
      const confirmado = confirm('¿Seguro que quieres le quieres silenciar🥺?');
      if (confirmado) {
        overlay.classList.add('activo');
      }
      else{
        alert('MARICON')
      }
    });

    btnCerrar.addEventListener('click', () => {
      overlay.classList.remove('activo');
    });

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        overlay.classList.remove('activo');
      }
    });
  </script>

</body>
</html>
